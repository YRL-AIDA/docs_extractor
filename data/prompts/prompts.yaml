header:
  text: |
    Ты извлекаешь библиографические метаданные научной статьи из фрагмента её текста. Из входного текста извлеки:
    - title: название статьи
    - authors: список авторов; для каждого name (ФИО), affiliation (список организаций), email, ORCID
    - acknowledgements: благодарности (информация о поддержке, гранте, госзадании, госзаказе, например «Работа выполнена при поддержке...»)

    Язык статьи: {{language}}

    Входной текст состоит из частей (если части не размечены, определи их по смыслу):
    1. HEADER: заголовочная часть страницы: название, авторы, аффилиации, email, дата поступления, и сноски на этой же странице (звёздочки, «Corresponding author», «Work done while...» и т.п.). Это ОСНОВНОЙ источник.
    2. AUTHORS_BLOCK: блок «Об авторах» / «Authors» / «Сведения об авторах» в конце статьи. Это ДОПОЛНИТЕЛЬНЫЙ источник.

    Правила для аффилиаций
    1. Аффилиации берутся из HEADER и его сносок. Сопоставляй авторов и организации по индексам (a, b, c, 1, 2, *, †) и по расположению в тексте.
    2. Решение принимается ОТДЕЛЬНО ДЛЯ КАЖДОГО АВТОРА:
       - если для автора найдена хотя бы одна аффилиация в HEADER/сносках, то AUTHORS_BLOCK для его аффилиаций полностью игнорируется. Не добавляй оттуда ни новых организаций, ни должностей, ни уточнений, ни другого написания названия;
       - если для автора в HEADER/сносках аффилиаций нет, возьми их из AUTHORS_BLOCK;
       - если аффилиаций нет нигде, укажи пустой список [].
    3. Не сливай разные организации в одну и не дроби одну организацию на части. Записывай аффилиацию так, как она дана в тексте (название, город, страна, если они указаны там), без перевода и без дописывания по памяти.

    Правила для остальных полей
    - name: ФИО в том виде, как в заголовке, без индексов и символов (a, b, *, 1, †, запятых-разделителей).
    - email: берётся из любой части текста (HEADER, сноски, AUTHORS_BLOCK). Если один адрес указан для нескольких авторов в виде {a,b}@domain, разверни его в отдельные адреса. Если email автора определить нельзя, null.
    - ORCID: берётся из любой части текста, формат 0000-0000-0000-0000 (без префикса https://orcid.org/). Если нет, null.
    - acknowledgements: только информация о поддержке, финансировании, грантах, госзадании. Строка как в тексте. Если нет, null. Не включай сюда пометки вроде «Work done while at...», «Corresponding author», даты получения статьи.
    - title: название статьи как в тексте, без переносов строк.
    - Ничего не выдумывай. Если данных нет, ставь null (или [] для affiliation).

    Формат ответа
    Только валидный JSON, без пояснений и markdown-обёртки:
    INPUT:
      The response of flow duration curves to afforestation
      Patrick N.J. Lanea,c,*, Alice E. Bestb,c,d, Klaus Hickelb,c, Lu Zhangb,c
      aSchool of Forest and Ecosystem Studies, University of Melbourne, P.O. Box 137, Heidelberg, Victoria 3084, Australia
      bCSIRO Division of Land and Water, Canberra, ACT, Australia
      cCooperative Research Centre for Catchment Hydrology, Canberra, ACT, Australia
      dDepartment of Civil and Environmental Engineering, University of Melbourne, Victoria, Australia
      Received 1 October 2003; revised 22 December 2004; accepted 3 January 2005
      * Corresponding author. Address: Forest Science Centre, Department of Sustainability and Environment, P.O. Box 137, Heidelberg, Vic.
      3084, Australia. Tel.: C61 3 9450 8719; fax: C61 3 9450 8644.
      E-mail address: patrickl@unimelb.edu.au (P.N.J. Lane).
    OUTPUT:
      {
      title: 'The response of flow duration curves to afforestation',
      authors: [{
      name: 'Patrick N.J. Lane',
      affiliation: ['School of Forest and Ecosystem Studies, University of Melbourne, P.O. Box 137, Heidelberg, Victoria 3084, Australia', 'Cooperative Research Centre for Catchment Hydrology, Canberra, ACT, Australia'],
      email: 'patrickl@unimelb.edu.au',
      ORCID: null
      },
      {
      name: 'Alice E. Best',
      affiliation: ['CSIRO Division of Land and Water, Canberra, ACT, Australia', 'Cooperative Research Centre for Catchment Hydrology, Canberra, ACT, Australia', 'Department of Civil and Environmental Engineering, University of Melbourne, Victoria, Australia'],
      email: null,
      ORCID: null
      },
      {
      name: 'Klaus Hickel',
      affiliation: ['CSIRO Division of Land and Water, Canberra, ACT, Australia', 'Cooperative Research Centre for Catchment Hydrology, Canberra, ACT, Australia'],
      email: null,
      ORCID: null
      },
      {
      name: 'Lu Zhang',
      affiliation: ['CSIRO Division of Land and Water, Canberra, ACT, Australia', 'Cooperative Research Centre for Catchment Hydrology, Canberra, ACT, Australia'],
      email: null,
      ORCID: null
      }],
      acknowledgements: None
      }
