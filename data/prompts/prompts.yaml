abstract:
  text: |
    Найди аннотацию в тексте и верни её в формате JSON.
    Типичная структура статьи: заголовок, авторы, журнал/год/рубрика,
    аннотация, ключевые слова, основной текст, о поддержке/гранте.
    Аннотация — краткое описание содержания: что рассмотрено, какие методы/результаты, заключение.
    НЕ включать в аннотацию:
    - информацию о поддержке, гранте, госзаказе ("Работа выполнена при поддержке...")
    - названия журналов, год, рубрику, УДК, DOI, номер страницы
    - ключевые слова
    - авторов и заголовок
    Если аннотации нет, то вместо текста сделай null, а массив индексов оставь пустым.
    Язык статьи: {{language}}
    OUTPUT:
    {
    "abstract": "*полный текст аннотации*",
    "index": [*индексы элементов, являющихся аннотацией*]
    }
    INPUT:
      {{input_text}}
    OUTPUT:
